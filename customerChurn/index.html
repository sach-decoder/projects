<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <title>Employee Numeric Entry Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
    }

    .title {
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 700;
      color: #0f172a;
    }

    .title p {
      color: #64748b;
      font-size: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      text-transform: capitalize;
    }

    .input-group input {
      height: 52px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 15px;
      background: #f8fafc;
      color: #0f172a;
      transition: 0.2s ease;
      outline: none;
    }

    .input-group input:focus {
      border-color: #94a3b8;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.15);
    }

    .submit-btn {
      margin-top: 35px;
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 16px;
      background: #334155;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover {
      background: #1e293b;
    }

    @media (max-width: 600px) {
      .container {
        padding: 28px;
      }

      .title h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      <h1>Customer Data Entry</h1>
      <p>Enter numeric values for all fields below.</p>
    </div>

    <form>

      <div class="form-grid">
  
        <div class="input-group">
          <label>credit_score</label>
          <input id="credit_score" type="number" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
          <label>country</label>
          <input id="country" type="number" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
          <label>gender</label>
          <input id="gender" type="number" step="any" placeholder="Enter value">
        </div> 

        <div class="input-group">
          <label>age</label>
          <input id="age" type="number" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
          <label>tenure</label>
          <input id="tenure" type="number" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
          <label>balance</label>
          <input id="balance" type="number" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
          <label>products_number</label>
          <input id="products_number" type="number" step="any" placeholder="Enter value">
        </div> 

        <div class="input-group">
          <label>credit_card</label>
          <input type="number" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
          <label>active_member</label>
          <input id="active member" type="number" step="any" placeholder="Enter value">
        </div> 

        <div class="input-group">
          <label>estimated_salary</label>
          <input id="estimated_salary" type="number" step="any" placeholder="Enter value">
        </div>

        <!-- <div class="input-group">
          <label>churn</label>
          <input id="churn" type="number" step="any" placeholder="Enter value">
        </div> -->

        <!-- <div class="input-group">
          <label>churn_probability</label>
          <input type="number" step="any" placeholder="Enter value">
        </div> -->

      </div>

      <button type="submit" class="submit-btn">
        Submit Data
      </button>

    </form>

  </div>

</body>
</html>
</body>
<script src="script.js"></script>
</html>
